<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>KalingaKavach</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F7F4;--surf:#fff;--line:#E5E4DF;--ink:#141413;--mut:#5C5B57;--acc:#1B4332;--onacc:#fff;--alert:#C84B31;--wash:#EFEDE6;--land:#EFEDE6;--water:#D9E2E0;--sparse:#9DBBA6;--core:#1B4332;--r:6px;--sans:'Instrument Sans',sans-serif;--mono:'IBM Plex Mono',monospace}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121513;--surf:#191D1A;--line:#2B312D;--ink:#ECEBE6;--mut:#A3A69F;--acc:#7FBF9B;--onacc:#101411;--alert:#E27A60;--wash:#212622;--land:#1D2320;--water:#223234;--sparse:#3F6B52;--core:#7FBF9B}}
:root[data-theme=dark]{--bg:#121513;--surf:#191D1A;--line:#2B312D;--ink:#ECEBE6;--mut:#A3A69F;--acc:#7FBF9B;--onacc:#101411;--alert:#E27A60;--wash:#212622;--land:#1D2320;--water:#223234;--sparse:#3F6B52;--core:#7FBF9B}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/21px var(--sans);padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em}button,select{font:inherit;color:inherit}.ic{width:16px;height:16px;flex:none}
.mono,.lbl{font-family:var(--mono)}.lbl{font-size:11px;line-height:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.app{display:flex;min-height:100vh}.side{width:196px;flex:none;border-right:1px solid var(--line);padding:18px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;background:var(--surf)}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 20px}.logo{width:30px;height:30px;border-radius:var(--r);background:var(--acc);color:var(--onacc);display:grid;place-items:center}
.nav{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:var(--r);border:1px solid transparent;background:none;cursor:pointer;text-align:left;width:100%;font-weight:500;color:var(--mut);transition:border-color .15s,color .15s}
.nav:hover{border-color:var(--line);color:var(--ink)}.nav.on{background:var(--wash);color:var(--ink);border-color:var(--line)}.nav .n{margin-left:auto;font:500 11px var(--mono);color:var(--alert)}
main{flex:1;min-width:0;padding:28px 32px 48px;max-width:1280px}
.top{display:flex;align-items:flex-end;gap:12px;margin-bottom:22px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px}.top h2{font-size:30px;line-height:34px}.top .sp{flex:1}
.chip{border:1px solid var(--line);background:var(--surf);border-radius:var(--r);padding:5px 11px;cursor:pointer;font-size:13px;transition:border-color .15s,background .15s}.chip:hover{border-color:var(--ink)}.chip.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.g{display:grid;gap:12px;grid-template-columns:repeat(12,minmax(0,1fr))}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.box{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px}.box h3{font-size:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline}
.strip{display:grid;grid-template-columns:repeat(4,1fr);padding:0}.strip div{padding:16px;border-right:1px solid var(--line)}.strip div:last-child{border:0}.strip b{display:block;font:500 28px/34px var(--mono);letter-spacing:-.02em;margin-top:4px}.strip small{color:var(--mut)}
.neg{color:var(--alert)}.pos{color:var(--acc)}
.row{display:grid;grid-template-columns:64px 1fr auto auto;gap:14px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;background:var(--surf);margin-bottom:6px;width:100%;text-align:left;transition:border-color .15s}.row:hover{border-color:var(--ink)}
.row b{display:block;font-weight:600}.row small{color:var(--mut)}.row .a{font:500 13px var(--mono)}
.tag{border:1px solid var(--line);border-radius:4px;padding:1px 7px;font:500 11px/16px var(--mono);white-space:nowrap;background:var(--wash)}.tag.p1{border-color:var(--alert);color:var(--alert);background:none}.tag.ok{background:var(--acc);color:var(--onacc);border-color:var(--acc)}.tag.as{border-color:var(--acc);color:var(--acc);background:none}
svg{display:block}.mapw{width:100%;height:auto}.pin{cursor:pointer}.pin:focus-visible{outline:2px solid var(--ink)}
.btn{border:1px solid var(--line);background:var(--surf);border-radius:var(--r);padding:9px 16px;cursor:pointer;font-weight:600;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:border-color .15s,background .15s}.btn:hover{border-color:var(--ink)}.btn.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc)}.btn:focus-visible,.nav:focus-visible,.chip:focus-visible,.row:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surf);border-left:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top,0px)) 20px 24px;overflow:auto;z-index:30}
.dl{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.dl span:first-child{color:var(--mut)}
select,.in{width:100%;padding:9px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);margin:6px 0 10px;font:inherit;color:var(--ink)}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:14px;font:12.5px/19px var(--mono);margin:0 0 12px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:var(--r);z-index:50;display:none}
@media(max-width:900px){.c3,.c4,.c5,.c7,.c8{grid-column:span 12}.strip{grid-template-columns:1fr 1fr}.strip div:nth-child(2){border-right:0}.strip div:nth-child(-n+2){border-bottom:1px solid var(--line)}.app{display:block}.side{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;flex-direction:row;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));z-index:20;border:0;border-top:1px solid var(--line)}.brand{display:none}.nav{flex-direction:column;gap:3px;font-size:11px;padding:6px 2px;justify-content:center;position:relative}.nav .n{position:absolute;top:0;right:14px;margin:0}main{padding:18px 14px 90px}.row{grid-template-columns:52px 1fr auto}.row .a{display:none}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></symbol><symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></symbol><symbol id="i-map" viewBox="0 0 24 24"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/></symbol><symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></symbol><symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h8"/></symbol><symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol><symbol id="i-contrast" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol><symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol><symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol></svg>
<div class="app"><nav class="side" aria-label="Main"></nav><main><div class="top"></div><div id="v"></div></main></div><div id="dr"></div><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),ic=n=>`<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const teams=[{id:'T1',n:'Team Alpha',l:'R. Behera, 2 rangers',s:'Available'},{id:'T2',n:'Team Bravo',l:'S. Mohanty, 3 rangers',s:'In field'},{id:'T3',n:'Team Charlie',l:'A. Das, 2 rangers',s:'Available'},{id:'T4',n:'Marine Patrol',l:'Boat unit, Dhamra',s:'Offline'}];
let A=[
{id:'BK-A',site:'Dangmal Creek Buffer',zone:'Bhitarkanika Sanctuary Core',ll:'20.71 N, 86.87 E',p:1,ha:4.2,pc:6.1,cause:'Storm surge damage',conf:86,st:'Unverified',d:'16 Nov 2026, 10:42',img:'Sentinel-2, 14 Nov',x:215,y:120,note:'Inspect the seaward tidal bund at Dangmal jetty. Verify root snap damage and log the GPS perimeter.'},
{id:'BK-B',site:'Habalikhati Block',zone:'Bhitarkanika buffer',ll:'20.65 N, 86.93 E',p:2,ha:2.8,pc:3.4,cause:'Aquaculture encroachment',conf:78,st:'Assigned',team:'T2',d:'15 Nov 2026, 16:05',img:'Sentinel-2, 14 Nov',x:330,y:205,note:'Check for new pond bunds along the creek edge and photograph boundary markers.'},
{id:'GH-C',site:'Gahirmatha Fringe',zone:'Gahirmatha Marine Sanctuary',ll:'20.78 N, 87.00 E',p:2,ha:1.9,pc:2.7,cause:'Coastal erosion',conf:71,st:'Unverified',d:'14 Nov 2026, 09:20',img:'Sentinel-1 SAR, 13 Nov',x:470,y:105,note:'Measure shoreline retreat at three fixed points.'},
{id:'HK-E',site:'Hukitola Bay',zone:'Mahanadi delta',ll:'20.33 N, 86.75 E',p:3,ha:1.4,pc:1.9,cause:'Canopy dieback, salinity stress',conf:59,st:'Unverified',d:'12 Nov 2026, 13:48',img:'Sentinel-2, 10 Nov',x:410,y:305,note:'Collect water salinity readings and leaf samples.'},
{id:'MD-D',site:'Paradeep Flats',zone:'Mahanadi delta',ll:'20.27 N, 86.65 E',p:3,ha:0.9,pc:1.2,cause:'Sediment shift',conf:64,st:'Verified',d:'09 Nov 2026, 11:10',img:'Sentinel-2, 07 Nov',x:140,y:290,note:'Verified by Team Alpha on 10 Nov.'}];
const cover=[12561,12544,12532,12519,12497,12486],months=['May','Jun','Jul','Aug','Sep','Oct'];
let S={v:'overview',f:'All',sel:null,L:{canopy:1,pins:1,ch:1,bd:1}};
const pri=a=>a.p==1?'P1':a.p==2?'P2':'P3',tn=id=>teams.find(t=>t.id==id).n;
const tag=a=>`<span class="tag ${a.st=='Verified'?'ok':a.st=='Assigned'?'as':''}">${a.st}${a.team?': '+tn(a.team):''}</span>`;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2400)}
function map(L){L=L||{canopy:1,pins:1,ch:1,bd:1};return `<svg class="mapw" viewBox="0 0 600 380" role="img" aria-label="Map of the Odisha coast with alert hotspots"><rect width="600" height="380" fill="var(--land)"/>
${L.ch?'<path d="M0 90Q120 70 220 130T420 220Q520 270 600 330" fill="none" stroke="var(--water)" stroke-width="24" stroke-linecap="round"/><path d="M220 130Q280 230 330 380M420 220Q470 120 520 0" fill="none" stroke="var(--water)" stroke-width="10"/><rect x="560" width="40" height="380" fill="var(--water)" opacity=".6"/>':''}
${L.canopy?'<path d="M90 40Q250 10 330 110Q360 200 280 250Q130 230 90 140Z" fill="var(--sparse)"/><path d="M140 70Q250 50 290 120Q290 190 230 215Q150 190 140 130Z" fill="var(--core)"/><path d="M360 230Q470 200 510 290Q450 350 360 330Z" fill="var(--sparse)"/><path d="M60 250Q150 230 200 300Q130 345 60 320Z" fill="var(--sparse)"/><path d="M400 40Q500 30 540 90Q500 150 420 130Z" fill="var(--sparse)"/>':''}
${L.bd?'<path d="M70 25Q260 -5 350 105Q385 205 295 265Q120 245 70 150Z" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="5 4"/><text x="80" y="44" font-size="10" font-family="IBM Plex Mono" fill="var(--ink)">BHITARKANIKA BOUNDARY</text>':''}
<text x="575" y="200" font-size="10" font-family="IBM Plex Mono" fill="var(--mut)" text-anchor="middle" transform="rotate(90 575 200)">BAY OF BENGAL</text>
${L.pins?A.map(a=>{const c=a.st=='Verified'?'var(--acc)':'var(--alert)';return `<g class="pin" data-a="open" data-id="${a.id}" tabindex="0" role="button" aria-label="${a.site}"><circle cx="${a.x}" cy="${a.y}" r="${a.p==1?20:13}" fill="${c}" fill-opacity=".18">${a.p==1&&a.st=='Unverified'?'<animate attributeName="r" values="13;22;13" dur="3s" repeatCount="indefinite"/>':''}</circle><circle cx="${a.x}" cy="${a.y}" r="5.5" fill="${c}" stroke="var(--surf)" stroke-width="2"/><text x="${a.x+11}" y="${a.y-9}" font-size="11" font-weight="500" font-family="IBM Plex Mono" fill="var(--ink)">${a.id}</text></g>`}).join(''):''}
<g transform="translate(22 350)" fill="var(--ink)" font-size="10" font-family="IBM Plex Mono"><path d="M0 0L6-20L12 0L6-5Z"/><text x="3" y="-24">N</text><rect x="30" y="-4" width="60" height="2"/><text x="30" y="11">10 km</text></g></svg>`}
function chart(){const w=600,h=180,mn=12470,mx=12570,P=cover.map((v,i)=>[36+i*(w-72)/5,h-30-(v-mn)/(mx-mn)*(h-62)]);return `<svg class="mapw" viewBox="0 0 ${w} ${h}" role="img" aria-label="Mangrove cover, May to October 2026"><g stroke="var(--line)">${[0,1,2].map(i=>`<line x1="20" x2="${w-20}" y1="${28+i*(h-58)/2}" y2="${28+i*(h-58)/2}"/>`).join('')}</g><path d="M${P.map(p=>p.join(',')).join('L')}" fill="none" stroke="var(--acc)" stroke-width="2"/>${P.map((p,i)=>`<rect x="${p[0]-3}" y="${p[1]-3}" width="6" height="6" fill="var(--acc)"/><text x="${p[0]}" y="${h-8}" font-size="10" font-family="IBM Plex Mono" text-anchor="middle" fill="var(--mut)">${months[i]}</text><text x="${p[0]}" y="${p[1]-10}" font-size="10" font-family="IBM Plex Mono" text-anchor="middle" fill="var(--ink)">${cover[i].toLocaleString()}</text>`).join('')}</svg>`}
const open=()=>A.filter(a=>a.st!='Verified');
const feed=l=>l.map(a=>`<button class="row" data-a="open" data-id="${a.id}"><span><span class="tag ${a.p==1?'p1':''}">${pri(a)}</span></span><span><b>${a.site}</b><small>${a.cause}</small></span><span class="a neg">-${a.ha} ha</span>${tag(a)}</button>`).join('')||'<p>No alerts match this filter.</p>';
const V={
overview(){const f=open().sort((a,b)=>a.p-b.p||b.ha-a.ha)[0],tot=A.reduce((s,a)=>s+a.ha,0).toFixed(1);return `<div class="g"><div class="box strip c12"><div><span class="lbl">Monitored cover</span><b>12,486 ha</b><small class="neg">-75 ha since May</small></div><div><span class="lbl">Lost in flagged sites</span><b>${tot} ha</b><small>${A.length} sites</small></div><div><span class="lbl">Open alerts</span><b>${open().length}</b><small>${open().filter(a=>a.p==1).length} at P1</small></div><div><span class="lbl">Teams in field</span><b>${teams.filter(t=>t.s=='In field').length} of ${teams.length}</b><small>${teams.filter(t=>t.s=='Available').length} available</small></div></div>
<div class="box c7"><h3>Hotspot map <span class="lbl">Odisha coast</span></h3>${map()}</div>
<div class="box c5">${f?`<h3>Next to verify <span class="tag p1">${pri(f)}</span></h3><p style="margin:0 0 2px;font-size:20px;font-weight:600;letter-spacing:-.02em">${f.site}</p><p class="lbl" style="margin:0 0 14px">${f.id} / ${f.ll}</p><div class="dl"><span>Area lost</span><b class="mono neg">-${f.ha} ha${f.pc?` (-${f.pc}%)`:''}</b></div><div class="dl"><span>Likely cause</span><b>${f.cause}</b></div><div class="dl"><span>Confidence</span><b class="mono">${f.conf!=null?f.conf+'%':'Ranger report'}</b></div><div class="dl"><span>Imagery</span><b class="mono">${f.img}</b></div><p style="color:var(--mut)">${f.note}</p><button class="btn pri" data-a="open" data-id="${f.id}">Review alert</button>`:'<h3>All clear</h3><p>Every flagged site is verified.</p>'}</div>
<div class="box c5"><h3>Cover, May to Oct 2026 <span class="lbl">hectares</span></h3>${chart()}</div>
<div class="box c7"><h3>Alert queue <button class="chip" data-a="nav" data-v="alerts">View all</button></h3>${feed(open().slice(0,4))}</div></div>`},
alerts(){return `<div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap">${['All','Unverified','Assigned','Verified'].map(f=>`<button class="chip ${S.f==f?'on':''}" data-a="filter" data-f="${f}">${f}</button>`).join('')}<span style="flex:1"></span><button class="btn pri" data-a="newalert">${ic('plus')}Report incident</button></div>${feed(A.filter(a=>S.f=='All'||a.st==S.f))}`},
map(){const K={canopy:'Canopy density',pins:'Alert hotspots',ch:'Tidal channels',bd:'Protected boundary'};return `<div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap">${Object.keys(K).map(k=>`<button class="chip ${S.L[k]?'on':''}" data-a="layer" data-k="${k}">${K[k]}</button>`).join('')}</div><div class="box" style="padding:0;overflow:hidden">${map(S.L)}</div><p class="lbl" style="margin-top:10px">Dark green: dense canopy. Light green: sparse canopy. Select a pin for details.</p>`},
activity(){return `<div class="box"><h3>Activity log <span class="lbl">${LOG.length} entries</span></h3>${LOG.length?LOG.map(e=>`<div class="dl"><span>${e.text}</span><span class="mono" style="color:var(--mut)">${new Date(e.ts).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}${e.by==UID?', you':''}</span></div>`).join(''):'<p style="color:var(--mut)">No activity yet. Assign or verify an alert and it will show up here.</p>'}</div>`},
teams(){return `<div class="g">${teams.map(t=>{const j=A.filter(a=>a.team==t.id);return `<div class="box c4"><h3>${t.n} <span class="tag ${t.s=='Available'?'ok':t.s=='In field'?'as':''}">${t.s}</span></h3><p style="margin:0 0 10px;color:var(--mut)">${t.l}</p><p class="lbl" style="margin:0">Assigned</p><p style="margin:2px 0 0">${j.length?j.map(a=>a.site).join(', '):'No assignments'}</p></div>`}).join('')}</div>`},
reports(){return `<div class="box"><h3>Generate a report</h3><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">${['Monthly summary','Incident log','Restoration priorities'].map(r=>`<button class="chip ${S.r==r?'on':''}" data-a="rep" data-r="${r}">${r}</button>`).join('')}</div>${S.r?`<pre id="rp">${report(S.r)}</pre><button class="btn pri" data-a="copy">${ic('file')}Copy report</button> <button class="btn" data-a="dl">Save as text file</button>`:'<p style="color:var(--mut)">Pick a report type to preview it here.</p>'}</div>`}};
function report(r){const n=open(),hd=`KALINGAKAVACH, ${r.toUpperCase()}\n1 to 20 Nov 2026. Sources: Sentinel-1/2 (demo data)\n\n`;
if(r=='Monthly summary')return hd+`Monitored cover: 12,486 ha (-75 ha since May).\nAlerts raised: ${A.length}. Verified: ${A.filter(a=>a.st=='Verified').length}. Open: ${n.length}.\nLargest loss: ${A[0].site}, -${A[0].ha} ha (${A[0].cause.toLowerCase()}, ${A[0].conf!=null?A[0].conf+'%':'ranger-reported'} model confidence).`;
if(r=='Incident log')return hd+A.map(a=>`${a.d} | ${a.id} ${a.site}: -${a.ha} ha, ${a.cause} (${a.conf!=null?a.conf+'%':'ranger report'}), ${a.st}`).join('\n');
return hd+[...n].sort((a,b)=>a.p-b.p||b.ha-a.ha).map((a,i)=>`${i+1}. ${a.site}: -${a.ha} ha. ${a.note}`).join('\n')}
const patch=l=>`<svg viewBox="0 0 80 80" style="width:100%;border:1px solid var(--line)"><rect width="80" height="80" fill="var(--land)"/><circle cx="40" cy="40" r="34" fill="var(--core)"/>${l?`<circle cx="52" cy="30" r="${8+l*2.4}" fill="var(--land)"/>`:''}</svg>`;
function drawer(){if(S.form){$('#dr').innerHTML=formHTML();return}const a=A.find(x=>x.id==S.sel);if(!a){$('#dr').innerHTML='';return}const av=teams.filter(t=>t.s=='Available');
$('#dr').innerHTML=`<aside class="drawer" role="dialog" aria-label="${a.site}"><button class="btn" data-a="back" style="margin-bottom:14px">${ic('back')}Back</button><div style="display:flex;justify-content:space-between;align-items:start;gap:10px"><div><span class="lbl">${a.id} / ${a.zone}</span><h3 style="font-size:22px;line-height:28px;margin-top:4px">${a.site}</h3><span class="mono" style="font-size:12px;color:var(--mut)">${a.ll}</span></div><button class="btn" data-a="close" aria-label="Close">${ic('x')}</button></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0"><div><span class="lbl">Before</span>${patch(0)}</div><div><span class="lbl">After</span>${patch(a.ha)}</div></div>
<div class="dl"><span>Priority</span><span class="tag ${a.p==1?'p1':''}">${pri(a)}</span></div><div class="dl"><span>Area lost</span><b class="mono neg">-${a.ha} ha${a.pc?` (-${a.pc}%)`:''}</b></div><div class="dl"><span>Likely cause</span><b>${a.cause}</b></div><div class="dl"><span>Confidence</span><b class="mono">${a.conf!=null?a.conf+'%':'Ranger report'}</b></div><div class="dl"><span>Imagery</span><b class="mono">${a.img}</b></div><div class="dl"><span>Detected</span><b class="mono">${a.d}</b></div><div class="dl"><span>Status</span>${tag(a)}</div>
<div class="box" style="background:var(--wash);margin:16px 0"><span class="lbl">Ranger instructions</span><p style="margin:4px 0 0">${a.note}</p></div>
${a.st=='Unverified'?`<label for="ts" class="lbl">Field team</label><select id="ts">${av.map(t=>`<option value="${t.id}">${t.n} (${t.l})</option>`).join('')||'<option value="">No teams available</option>'}</select><button class="btn pri" style="width:100%;margin-bottom:8px" data-a="assign" data-id="${a.id}">${ic('users')}Assign field team</button>`:''}
${a.st!='Verified'?`<button class="btn" style="width:100%" data-a="verify" data-id="${a.id}">${ic('check')}Mark as verified</button>`:`<button class="btn" style="width:100%" data-a="reopen" data-id="${a.id}">Reopen alert</button>`}</aside>`}
function render(){const T={overview:'Overview',alerts:'Alerts',map:'Map',teams:'Field teams',reports:'Reports',activity:'Activity'},I={overview:'grid',alerts:'bell',map:'map',teams:'users',reports:'file',activity:'list'};
$('.side').innerHTML=`<div class="brand"><div class="logo">${ic('shield')}</div><div><h1 style="font-size:16px;line-height:18px">KalingaKavach</h1><span class="lbl">Odisha coast</span></div></div>`+Object.keys(T).map(k=>`<button class="nav ${S.v==k?'on':''}" data-a="nav" data-v="${k}">${ic(I[k])}${T[k]}${k=='alerts'?`<span class="n">${open().length}</span>`:''}</button>`).join('');
$('.top').innerHTML=`${S.v!='overview'?`<button class="btn" data-a="back" aria-label="Go back">${ic('back')}Back</button>`:''}<div><span class="lbl">20 Nov 2026 / Last pass: Sentinel-2, 14 Nov</span><h2>${T[S.v]}</h2></div><span class="sp"></span><span class="tag ${sync=='Synced'?'ok':''}">${sync}</span><button class="chip" data-a="theme" style="display:inline-flex;gap:6px;align-items:center">${ic('contrast')}Theme</button>`;$('#v').innerHTML=V[S.v]();drawer()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id,x=A.find(z=>z.id==id);
if(a=='nav'){go(t.dataset.v);return}
else if(a=='newalert'){go('report');return}else if(a=='submitalert'){submitAlert();return}else if(a=='dl'){saveTxt();return}else if(a=='open'){go(S.v,id);return}else if(a=='close'||a=='back'){back();return}else if(a=='filter')S.f=t.dataset.f;
else if(a=='layer')S.L[t.dataset.k]^=1;else if(a=='rep')S.r=t.dataset.r;
else if(a=='assign'){const v=$('#ts').value;if(!v){toast('No team is available right now');return}mutate(x,{st:'Assigned',team:v},{id:v,s:'In field'},`${tn(v)} assigned to ${x.site}`);return}
else if(a=='verify'){mutate(x,{st:'Verified'},x.team?{id:x.team,s:'Available'}:null,`${x.site} marked as verified`);return}
else if(a=='reopen'){mutate(x,{st:'Unverified',team:null},x.team?{id:x.team,s:'Available'}:null,`${x.site} reopened`);return}
else if(a=='theme'){const d=document.documentElement,dk=d.dataset.theme?d.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dk?'light':'dark'}
else if(a=='copy'){navigator.clipboard.writeText($('#rp').textContent).then(()=>toast('Report copied'),()=>toast('Copy blocked. Select the text and copy it by hand.'));return}
render()});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&(S.sel||S.form))back();if(e.key=='Enter'&&e.target.matches('.pin'))e.target.dispatchEvent(new Event('click',{bubbles:true}))});
let depth=0;const TV=['overview','alerts','map','teams','reports','activity'];let DB=null,UID=null,sync='Local demo';const LOG=[];
function parse(){const h=location.hash.slice(1)||'overview';S.form=h=='report';if(h.startsWith('alert-')){const a=A.find(x=>x.id.toLowerCase()==h.slice(6));S.sel=a?a.id:null}else{S.sel=null;if(TV.includes(h))S.v=h}render()}
function go(v,sel){const h=sel?'alert-'+sel.toLowerCase():v;if(location.hash.slice(1)==h)return;depth++;location.hash=h}
function back(){if(depth>0){depth--;history.back()}else go(S.sel||S.form?S.v:'overview')}
async function mutate(x,patch,tm,msg){if(DB){try{await DB.doc('alerts/'+x.id).update(patch);if(tm)await DB.doc('teams/'+tm.id).update({s:tm.s})}catch(e){toast('Could not save. You may have view-only access.');return}}else{Object.assign(x,patch);if(tm)teams.find(z=>z.id==tm.id).s=tm.s}toast(msg);logit(msg);render()}
async function logit(text){const e={ts:Date.now(),text,by:UID||'local'};if(DB){try{await DB.collection('activity').add(e)}catch(_){}}else LOG.unshift(e)}
function formHTML(){const o=['Illegal clearing','Aquaculture encroachment','Coastal erosion','Storm surge damage','Canopy dieback','Other'].map(c=>`<option>${c}</option>`).join('');return `<aside class="drawer" role="dialog" aria-label="Report incident"><button class="btn" data-a="back" style="margin-bottom:14px">${ic('back')}Back</button><h3 style="font-size:22px;margin-bottom:14px">Report an incident</h3><label class="lbl" for="f1">Site</label><input id="f1" class="in" placeholder="Creek, block or village"><label class="lbl" for="f2">Cause</label><select id="f2">${o}</select><label class="lbl" for="f3">Area affected (ha)</label><input id="f3" class="in" type="number" min="0" step="0.1" value="1"><label class="lbl" for="f4">Priority</label><select id="f4"><option value="1">P1, act now</option><option value="2" selected>P2</option><option value="3">P3</option></select><label class="lbl" for="f5">Notes for the verifier</label><textarea id="f5" class="in" rows="3"></textarea><button class="btn pri" style="width:100%;margin-top:12px" data-a="submitalert">Submit report</button></aside>`}
async function submitAlert(){const site=$('#f1').value.trim();if(!site){toast('Add a site name');return}const id='FR-'+Date.now().toString(36).toUpperCase().slice(-4),o={site,zone:'Field report',ll:'GPS pending',p:+$('#f4').value,ha:parseFloat($('#f3').value)||0,pc:null,cause:$('#f2').value,conf:null,st:'Unverified',d:new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}),img:'Ranger report',x:Math.round(110+Math.random()*340),y:Math.round(60+Math.random()*250),note:$('#f5').value.trim()||'Verify on site and log the perimeter.'};if(DB){try{await DB.doc('alerts/'+id).set(o)}catch(e){toast('Could not save. You may have view-only access.');return}}else A.push({...o,id});toast(`Report ${id} submitted`);logit(`Reported ${site} (${id})`);S.form=false;if(location.hash.slice(1)=='report')go(S.v);else render()}
async function saveTxt(){try{const d=await claude.use('downloads');if(!d){toast('Saving is not available here');return}await d.save({filename:'kalingakavach-report.txt',data:$('#rp').textContent})}catch(e){toast('Save cancelled')}}
(async()=>{try{if(!window.claude)return;DB=await claude.use('db');const u=await claude.use('user');if(u&&u.id)UID=await u.id()}catch(e){DB=null}
if(!DB)return;sync='Connecting';render();const off=()=>{sync='Offline, showing last data';render()},tm=setTimeout(off,10000);
DB.collection('alerts').onSnapshot(s=>{clearTimeout(tm);A.length=0;s.docs.forEach(d=>A.push({...d.data(),id:d.id}));sync='Synced';parse()},off);
DB.collection('teams').onSnapshot(s=>{teams.length=0;s.docs.forEach(d=>teams.push({...d.data(),id:d.id}));render()},off);
DB.collection('activity').orderBy('ts','desc').limit(50).onSnapshot(s=>{LOG.length=0;s.docs.forEach(d=>LOG.push(d.data()));render()},off)})();
addEventListener('hashchange',parse);parse();
</script></body></html>
